# ~/.tmux.conf → ~/z/shared/configs/tmux.conf (symlinked)
# Minimal, opinionated. Pairs with the prefix-free nvim config in ~/nvim.

# ---------------------------------------------------------------------------
# Pass-through correctness for nvim
# ---------------------------------------------------------------------------
# 24-bit color so termguicolors + tokyonight render properly
set -g  default-terminal "tmux-256color"
set -ag terminal-overrides ",*256col*:Tc"

# Forward FocusGained / FocusLost so nvim's auto-checktime fires
set -g focus-events on

# Don't slow down ESC for vim mode-switching
set -sg escape-time 10

# System clipboard via OSC52 (works over SSH on terminals that support it)
set -g set-clipboard on

# ---------------------------------------------------------------------------
# Comfort
# ---------------------------------------------------------------------------
set -g  history-limit 50000
# Use tmux's default mouse bindings: dragging copies on release and exits copy
# mode; wheel scrolling, pane clicking, and border dragging keep working.
set -g  mouse on
setw -g mode-keys vi
set -g  status-keys vi

# Index windows/panes from 1 (matches the 1-9 row on the keyboard)
set -g  base-index 1
setw -g pane-base-index 1
set -g  renumber-windows on

# ---------------------------------------------------------------------------
# Prefix: Ctrl-a — classic, ergonomic with Caps→Ctrl remap
# ---------------------------------------------------------------------------
unbind C-b
set -g prefix C-a
bind   C-a send-prefix

# ---------------------------------------------------------------------------
# Keybinds (after prefix)
# ---------------------------------------------------------------------------
# Splits — match nvim's window-prefix: wo → vertical, wu → horizontal.
# Keep | and - as visual-character alternatives.
bind o split-window -h -c "#{pane_current_path}"
bind u split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Close current pane — matches nvim's ww (window-close). Asks first.
bind w confirm-before -p "kill pane #P? (y/n) " kill-pane

# Equalize panes — matches nvim's we (window-equalize)
# even-horizontal: all panes side-by-side (equal-width vertical splits)
# even-vertical:   all panes stacked     (equal-height horizontal splits)
bind e select-layout even-horizontal
bind v select-layout even-vertical

# Detach — matches nvim's q (quit). `prefix d` also works (tmux default).
bind q detach-client

# Buffer-like nav between tmux windows — matches nvim's Bj / Bl (b j / b l)
bind b switch-client -T B-prefix
bind -T B-prefix j previous-window
bind -T B-prefix l next-window

# Pane navigation — IJKL (matches the nvim geometry: i up, k down, j left, l right)
bind i select-pane -U
bind k select-pane -D
bind j select-pane -L
bind l select-pane -R

# Pane resize — prefix s enters resize mode, then ijkl (same as navigation); any other key exits
bind s switch-client -T resize-mode
bind -T resize-mode i resize-pane -U 3 \; switch-client -T resize-mode
bind -T resize-mode k resize-pane -D 3 \; switch-client -T resize-mode
bind -T resize-mode j resize-pane -L 5 \; switch-client -T resize-mode
bind -T resize-mode l resize-pane -R 5 \; switch-client -T resize-mode

# New window inherits cwd
bind c new-window -c "#{pane_current_path}"

# Reload config in place
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# vi-mode copy: v = visual, y = yank to system clipboard
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel

# ---------------------------------------------------------------------------
# Pane borders — heavy lines, arrows mark the active pane, bright blue active
# ---------------------------------------------------------------------------
set -g pane-border-lines        double
set -g pane-border-indicators   both
set -g pane-border-style        "fg=colour238"
set -g pane-active-border-style "fg=colour39,bold"

# Dim inactive pane backgrounds (no effect inside nvim/other TUIs)
set -g window-active-style      bg=colour232
set -g window-style             bg=colour238

# ---------------------------------------------------------------------------
# Status bar — minimal
# ---------------------------------------------------------------------------
set -g status-style                 "bg=default,fg=default"
set -g status-left                  "#[bold]#S  "
set -g status-left-length           30
set -g status-right                 "#(date '+%a %H:%M') "
set -g status-right-length          30
set -g window-status-format         " #I:#W "
set -g window-status-current-format "#[reverse] #I:#W "

# ---------------------------------------------------------------------------
# Quick reference
# ---------------------------------------------------------------------------
#   tmux new -s work       # start named session
#   tmux a -t work         # reattach
#   prefix d               # detach (work keeps running)
#   prefix o / u           # split vertical / horizontal  (matches nvim wo/wu)
#   prefix i k j l         # navigate panes               (matches nvim IJKL)
#   prefix s, then ijkl    # resize panes (stay in mode; any other key exits)
#   prefix w               # close pane                   (matches nvim ww)
#   prefix e               # even-horizontal (side-by-side) (matches nvim we)
#   prefix v               # even-vertical   (stacked)
#   prefix b j / b l       # prev / next tmux window      (matches nvim Bj/Bl)
#   prefix q               # detach session               (matches nvim q)
#   prefix r               # reload this config
#   prefix [               # enter copy-mode (v select, y yank, q quit)
