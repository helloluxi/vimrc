quickfix-close   = <cmd>cclose<CR>

# macros (single-register: q)
macro-record     = <cmd>lua if vim.fn.reg_recording() ~= "" then vim.cmd("normal! q") else vim.cmd("normal! qq") end<CR>
macro-replay     = <cmd>normal! @q<CR>

# diagnostic float
lsp-diagnostic-float = <cmd>lua vim.diagnostic.open_float()<CR>

# numbers
number-increment = ^a
number-decrement = ^x

# marks (telescope picker)
find-marks       = <cmd>Telescope marks<CR>

# comments (Neovim built-in commenting, 0.10+)
comment-toggle-line   = <cmd>lua local l=vim.fn.line(".");require("vim._comment").toggle_lines(l,l)<CR>
comment-toggle-visual = <ESC><cmd>lua require("vim._comment").toggle_lines(vim.fn.line("'<"),vim.fn.line("'>"))<CR>

# lutex (nvim-only; guarded via _G.lutex_call so a missing ~/lutex warns instead of erroring)
lutex-listen         = <cmd>lua _G.lutex_call('start')<CR>
lutex-stop           = <cmd>lua _G.lutex_call('stop')<CR>
lutex-md             = <cmd>lua _G.lutex_call('open','md')<CR>
lutex-slides         = <cmd>lua _G.lutex_call('open','slides')<CR>
lutex-tex            = <cmd>lua _G.lutex_call('open','tex')<CR>
lutex-scroll         = <cmd>lua _G.lutex_call('scroll')<CR>
lutex-inline-display = <cmd>lua _G.lutex_call('inline_to_display')<CR>
