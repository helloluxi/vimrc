# vocab-vim.conf — vim RHS for abstract names from keybinds.conf
#
# Same syntax as vocab-nvim.conf. Plain vim 8.1+; no plugins, no LSP, no Telescope.
# Abstract names absent from this file are skipped by run.sh's vimrc generator,
# leaving their LHS as <Nop> from the blank-slate preamble. That's how
# nvim-only clusters (lsp-*, find-*, comment-*, file-explorer, new-terminal)
# disappear cleanly from the vim build.

# --- navigation
up = k
down = j
left = h
right = l
file-top = gg
file-bottom = G
line-start = ^
line-end = $
word-left = b
word-right = w
para-prev = {
para-next = }
page-up = ^uzz
page-down = ^dzz
jump-back = ^o
jump-forward = ^i
view-center = zz

# --- insert / append / open
insert = i
insert-line = I
append = a
append-line = A
open-below = o
open-above = O

# --- undo / repeat
undo = u
redo = ^r
repeat-last = .

# --- search
find-forward = /
find-backward = ?
next-match = n
prev-match = N

# --- visual
visual-char = v
visual-line = V
visual-block = ^v

# --- delete (char / word / line / text objects)
delete-char = x
delete-char-back = X
delete-word = dw
delete-word-end = de
delete-word-back = db
delete-line = dd
delete-to-line-start = d0
delete-to-line-end = d$
delete-inner-word = diw
delete-around-word = daw
delete-inner-paren = di(
delete-around-paren = da(
delete-inner-bracket = di[
delete-around-bracket = da[
delete-inner-brace = di{
delete-around-brace = da{
delete-inner-double-quote = di\"
delete-around-double-quote = da\"
delete-inner-single-quote = di'
delete-around-single-quote = da'
delete-inner-backtick = di`
delete-around-backtick = da`

# --- change
change-word = cw
change-word-end = ce
change-word-back = cb
change-line = cc
change-to-line-start = c0
change-to-line-end = c$
change-inner-word = ciw
change-around-word = caw
change-inner-paren = ci(
change-around-paren = ca(
change-inner-bracket = ci[
change-around-bracket = ca[
change-inner-brace = ci{
change-around-brace = ca{
change-inner-double-quote = ci\"
change-around-double-quote = ca\"
change-inner-single-quote = ci'
change-around-single-quote = ca'
change-inner-backtick = ci`
change-around-backtick = ca`

# --- yank
yank-word = yw
yank-word-end = ye
yank-word-back = yb
yank-line = yy
yank-to-line-start = y0
yank-to-line-end = y$
yank-inner-word = yiw
yank-around-word = yaw
yank-inner-paren = yi(
yank-around-paren = ya(
yank-inner-bracket = yi[
yank-around-bracket = ya[
yank-inner-brace = yi{
yank-around-brace = ya{
yank-inner-double-quote = yi\"
yank-around-double-quote = ya\"
yank-inner-single-quote = yi'
yank-around-single-quote = ya'
yank-inner-backtick = yi`
yank-around-backtick = ya`

# --- paste
paste-after = p
paste-before = P

# --- visual-mode operators
yank-selection = y
delete-selection = d
change-selection = c
paste-over-selection = p
indent-right-selection = >gv
indent-left-selection = <gv

# --- move lines / selections
move-line-up = :<C-U>execute 'move .-' . (v:count1 + 1)<CR>==
move-line-down = :<C-U>execute 'move .+' . v:count1<CR>==
move-selection-up = :<C-U>execute "'<,'>move '<-" . (v:count1 + 1)<CR>gv=gv
move-selection-down = :<C-U>execute "'<,'>move '>+" . v:count1<CR>gv=gv

# --- file / buffer
save = :w<CR>
quit = :q<CR>
reload-file = :checktime<CR>
buffer-prev = :bprevious<CR>
buffer-next = :bnext<CR>
buffer-close = :bd<CR>

# --- windows
window-left = ^wh
window-right = ^wl
window-up = ^wk
window-down = ^wj
window-split-v = :vsplit<CR>
window-split-h = :split<CR>
window-close = :close<CR>
window-shrink = :<C-U>execute 'vertical resize -' . (v:count1 * 5)<CR>
window-grow = :<C-U>execute 'vertical resize +' . (v:count1 * 5)<CR>
window-equalize = ^w=

# --- folds
fold-toggle = za
fold-open-all = zR
fold-close-all = zM

# --- numbers
number-increment = ^a
number-decrement = ^x

# --- quickfix
quickfix-prev = :cprev<CR>
quickfix-next = :cnext<CR>
quickfix-open = :copen<CR>
quickfix-close = :cclose<CR>

# --- macros (single-register q, toggle via function in vimrc preamble)
macro-record = :call ToggleMacroQ()<CR>
macro-replay = @q

# --- terminal (vim 8.1+)
open-terminal = :terminal<CR>
